name: Build and deploy to WordPress.org
on:
  release:
    types: [published]
jobs:
  tag:
    name: New release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Composer dependencies
        uses: php-actions/composer@v6
        with:
          dev: no
          php_version: 8.0
          php_extensions: bcmath

      - name: Install WP-CLI
        run: |
          curl -fsSLO https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
          chmod +x wp-cli.phar
          sudo mv wp-cli.phar /usr/local/bin/wp

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          check-latest: true
          package-manager-cache: false

      - name: Set Execute Permissions for build_i18n.sh
        run: chmod +x bin/build_i18n.sh

      - name: Build assets and translation files
        run: |
          npm ci
          npm run check-engines
          npm run build

      - name: Verify built release files
        run: |
          test -s vendor/autoload.php
          test -s assets/js/frontend/blocks.js
          test -s assets/js/frontend/blocks.asset.php
          test -s assets/js/frontend/modalCheckout.js
          test -s assets/js/frontend/blocksModalCheckout.js
          test -s assets/js/backend/gatewayIconMedia.js
          test -s languages/btcpay-greenfield-for-woocommerce.pot

      # Include generated assets and vendor files, even though Git ignores them.
      - name: Package built plugin ZIP
        id: package
        env:
          PLUGIN_SLUG: btcpay-greenfield-for-woocommerce
        run: |
          package_dir="$(mktemp -d)"
          mkdir "$package_dir/$PLUGIN_SLUG"
          rsync -a --exclude-from=.distignore ./ "$package_dir/$PLUGIN_SLUG/"
          (cd "$package_dir" && zip -qr "$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" "$PLUGIN_SLUG")
          echo "zip-path=$GITHUB_WORKSPACE/$PLUGIN_SLUG.zip" >> "$GITHUB_OUTPUT"

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: btcpay-greenfield-for-woocommerce

      - name: Upload built plugin ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_ZIP: ${{ steps.package.outputs.zip-path }}
        run: |
          test -s "$RELEASE_ZIP"
          unzip -tq "$RELEASE_ZIP"
          gh release upload "$RELEASE_TAG" "$RELEASE_ZIP"
